apiVersion: v1
kind: Service
metadata:
  name: {{ include "pod-deletion-cost-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pod-deletion-cost-controller.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "pod-deletion-cost-controller.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: 8080
      targetPort: health
      protocol: TCP
