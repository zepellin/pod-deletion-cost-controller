{{- if and .Values.rbac.create (eq .Values.rbac.scope "namespaced") }}
{{- $root := . }}
{{- $namespaces := include "pod-deletion-cost-controller.targetNamespaces" . }}
{{- if not $namespaces }}
{{- fail "rbac.scope=namespaced requires at least one entry in config.targets, otherwise the controller is granted no access to any pods" }}
{{- end }}
{{- range $ns := splitList "," $namespaces }}
---
# Namespace-scoped equivalent of the ClusterRole, granted only in namespaces
# named by config.targets. The namespace must already exist at install time.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pod-deletion-cost-controller.fullname" $root }}
  namespace: {{ $ns }}
  labels:
    {{- include "pod-deletion-cost-controller.labels" $root | nindent 4 }}
rules:
  {{- include "pod-deletion-cost-controller.rules" $root | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pod-deletion-cost-controller.fullname" $root }}
  namespace: {{ $ns }}
  labels:
    {{- include "pod-deletion-cost-controller.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "pod-deletion-cost-controller.fullname" $root }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pod-deletion-cost-controller.serviceAccountName" $root }}
    namespace: {{ $root.Release.Namespace }}
{{- end }}
{{- end }}
