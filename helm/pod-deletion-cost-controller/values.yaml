replicaCount: 1

image:
  repository: ghcr.io/zepellin/pod-deletion-cost-controller
  pullPolicy: IfNotPresent
  # Overrides the image tag; defaults to Chart.appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # If not set, a name is generated using the fullname template.
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Leader election is automatically enabled when replicaCount > 1.
# Set enabled: true to force it on with a single replica (e.g. during testing).
leaderElection:
  enabled: false

rbac:
  # Create the Role/ClusterRole and bindings the controller needs.
  # Disable only if you manage RBAC out of band.
  create: true
  # scope: how widely the controller is granted pod get/list/watch/patch.
  #   cluster    — one ClusterRole covering every namespace. Works with any
  #                target, including namespaces created after install.
  #   namespaced — a Role and RoleBinding in each namespace named by
  #                config.targets. Least privilege, but every target namespace
  #                must already exist at install time, and adding a target
  #                requires a helm upgrade to grant access to its namespace.
  scope: cluster

podDisruptionBudget:
  enabled: false
  # minAvailable and maxUnavailable are mutually exclusive; minAvailable takes
  # precedence if both are set. Ignored when podDisruptionBudget.enabled is false.
  minAvailable: 1
  # maxUnavailable: 1

# ServiceMonitor for Prometheus Operator. Requires the monitoring.coreos.com CRD.
serviceMonitor:
  enabled: false
  # namespace: monitoring   # defaults to the release namespace
  # interval: 30s
  # scrapeTimeout: 10s
  # additionalLabels: {}    # extra labels to add to the ServiceMonitor (e.g. for label-based Prometheus selection)

# log level: debug | info | warn | error
logLevel: info

# Controller configuration — rendered into a ConfigMap and mounted into the pod.
config:
  # How often to reconcile all target pods.
  syncInterval: "60s"

  # CPU threshold above which a pod is considered "busy".
  # Uses Kubernetes quantity notation: "100m" = 100 millicores, "0.5" = 500 millicores.
  # Tune this to be above the idle/sidecar noise floor for your workload.
  busyCPUThreshold: "500m"

  # pod-deletion-cost assigned to busy pods (higher = less likely to be deleted).
  busyCost: 10000

  # pod-deletion-cost assigned to idle pods (lower = preferred for deletion).
  idleCost: 0

  # pod-deletion-cost assigned when metrics are not yet available (e.g. pod just started).
  # Set equal to busyCost to protect starting pods from preemption.
  noMetricsCost: 10000

  # Workloads to manage. Each entry targets all pods matching the label selector
  # within the given namespace.
  targets: []
  # Example:
  # targets:
  #   - namespace: default
  #     labelSelector: "app=video-processor"
  #     # containers: list specific container names to include in the CPU sum.
  #     # Leave empty to sum ALL containers (including native sidecars).
  #     # Use this to exclude sidecar CPU from the busy decision.
  #     containers: []
  #     # strategy selects the costing algorithm (default: "threshold").
  #     # "threshold"           — fixed busyCost when above threshold, idleCost otherwise.
  #     # "escalating"          — cost increments by escalatingStep each busy sync cycle,
  #     #                         up to escalatingMax; resets to idleCost when idle.
  #     #                         Gives long-running busy pods stronger protection over time.
  #     # "escalating-weighted" — same, but the increment is scaled by CPU usage, so a pod
  #     #                         burning 1000m gains 10x more per cycle than one at 100m.
  #     strategy: threshold
  #
  #   - namespace: processing
  #     labelSelector: "app=file-processor,tier=worker"
  #     containers:
  #       - main
  #     strategy: escalating
  #     # escalatingStep: cost added per busy sync cycle (default: busyCost/10).
  #     escalatingStep: 1000
  #     # escalatingMax: cost ceiling for the escalating strategies (default: 1000000).
  #     escalatingMax: 1000000
  #
  #   - namespace: rendering
  #     labelSelector: "app=renderer"
  #     strategy: escalating-weighted
  #     # escalatingStep is the cost added per cycle for a pod at escalatingCPUReference;
  #     # pods above or below that get proportionally more or less.
  #     escalatingStep: 1000
  #     # escalatingCPUReference: usage that earns a full step (default: "1000m", one core).
  #     escalatingCPUReference: "1000m"
  #     escalatingMax: 1000000
