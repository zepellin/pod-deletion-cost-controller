name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (k8s ${{ matrix.k8s-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s-version: ["1.33.x", "1.34.x", "1.35.x", "1.36.x"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Cache envtest binaries
        uses: actions/cache@v5
        with:
          path: bin/envtest-assets
          key: envtest-${{ matrix.k8s-version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Run tests
        run: make test ENVTEST_K8S_VERSION=${{ matrix.k8s-version }}

      - name: Build
        run: make build

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lint chart
        run: |
          helm lint helm/pod-deletion-cost-controller \
            --set 'config.targets[0].namespace=default' \
            --set 'config.targets[0].labelSelector=app=test-worker'

      - name: Render templates
        run: |
          helm template pdcc helm/pod-deletion-cost-controller \
            --set 'config.targets[0].namespace=default' \
            --set 'config.targets[0].labelSelector=app=test-worker'

  helm-install:
    name: Helm install test
    runs-on: ubuntu-latest
    needs: helm-lint
    steps:
      - uses: actions/checkout@v6

      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0

      - name: Build controller image
        run: docker build -t pod-deletion-cost-controller:ci .

      - name: Load image into kind
        run: kind load docker-image pod-deletion-cost-controller:ci

      - name: Install chart
        run: |
          helm install pdcc ./helm/pod-deletion-cost-controller \
            --namespace pdcc-system \
            --create-namespace \
            --set image.repository=pod-deletion-cost-controller \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --set config.syncInterval=5s \
            --set 'config.targets[0].namespace=default' \
            --set 'config.targets[0].labelSelector=app=test-worker'

      - name: Wait for controller to be ready
        run: |
          kubectl rollout status deployment/pdcc-pod-deletion-cost-controller \
            -n pdcc-system --timeout=120s

      - name: Deploy test workload
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: test-worker
            namespace: default
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: test-worker
            template:
              metadata:
                labels:
                  app: test-worker
              spec:
                containers:
                  - name: main
                    image: busybox:stable
                    command: ["sh", "-c", "while true; do sleep 1; done"]
          EOF
          kubectl wait --for=condition=Available deployment/test-worker \
            -n default --timeout=120s

      - name: Wait for annotations to appear
        run: |
          echo "Waiting for pod-deletion-cost annotations (up to 60s)..."
          for i in $(seq 1 30); do
            total=$(kubectl get pods -l app=test-worker -n default --no-headers 2>/dev/null | wc -l)
            annotated=$(kubectl get pods -l app=test-worker -n default \
              -o jsonpath='{.items[*].metadata.annotations.controller\.kubernetes\.io/pod-deletion-cost}' \
              2>/dev/null | wc -w)
            if [ "$total" -gt 0 ] && [ "$annotated" -eq "$total" ]; then
              echo "All $total pods annotated"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: only $annotated/$total pods annotated after 60s"
              kubectl logs -l app.kubernetes.io/instance=pdcc -n pdcc-system --tail=50
              exit 1
            fi
            sleep 2
          done

      - name: Verify annotation values
        run: |
          kubectl get pods -l app=test-worker -n default \
            -o custom-columns='NAME:.metadata.name,COST:.metadata.annotations.controller\.kubernetes\.io/pod-deletion-cost'
          values=$(kubectl get pods -l app=test-worker -n default \
            -o jsonpath='{.items[*].metadata.annotations.controller\.kubernetes\.io/pod-deletion-cost}')
          for val in $values; do
            if [ "$val" != "10000" ]; then
              echo "ERROR: unexpected annotation value '$val' (want 10000)"
              exit 1
            fi
          done
          echo "All annotations correct (noMetricsCost=10000, as expected without metrics-server)"
